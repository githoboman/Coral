# Corral CI (v3 — TS stack, ADRs D19–D24). The guardrails from CLAUDE.md §4.
# eslint + dependency-cruiser boundary enforcement is ticketed as T-005b;
# until it lands, the boundary jobs below use grep checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: "@corral/core: strict tsc + vitest/fast-check"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: packages/core }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: packages/core/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  server:
    name: "server: tsc + vitest (Coral lineage)"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm test

  app:
    name: "app: tsc -b + vite build"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  boundaries:
    name: "core purity + policy-widening + approval greps"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "@corral/core imports nothing but zod (CLAUDE.md §2.8)"
        run: |
          set -euo pipefail
          BAD=$(grep -rhoE 'from "[^"]+"' packages/core/src --include='*.ts' \
            | sed 's/from "//; s/"//' | sort -u | grep -vE '^(zod|\./)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::@corral/core must stay pure (zod + relative imports only). Found:"
            echo "$BAD"
            exit 1
          fi
      - name: "enableSessions only in the session-install module (CLAUDE.md §2.3)"
        run: |
          set -euo pipefail
          HITS=$(grep -rn "enableSessions" server/src app/src packages/core/src 2>/dev/null \
            | grep -v "server/src/services/evm/sessionInstall" || true)
          if [ -n "$HITS" ]; then
            echo "::error::enableSessions referenced outside the install module:"
            echo "$HITS"
            exit 1
          fi
      - name: "no unbounded approvals (CLAUDE.md §2.5)"
        run: |
          set -euo pipefail
          HITS=$(grep -rniE "maxUint256|MAX_UINT256" server/src packages/core/src 2>/dev/null \
            | grep -i "approv" || true)
          if [ -n "$HITS" ]; then
            echo "::error::possible unbounded approval:"
            echo "$HITS"
            exit 1
          fi

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: contracts }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vvv

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
