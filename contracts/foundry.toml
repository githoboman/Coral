[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# CorralJournal is ~40 LOC with no storage; keep builds deterministic
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
