[workspace]
resolver = "2"
members = [
    "crates/corral-core",
    "crates/corral-chain",
    "crates/corral-adapters",
    "crates/corral-signer",
    "crates/corral-relayer",
    "crates/corral-jobs",
    "crates/corral-indexer",
    "crates/corral-api",
    "crates/corral-db",
]

[workspace.dependencies]
# Pure, WASM-compatible — the only kind of dependency corral-core may take
alloy-primitives = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
proptest = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Amount handling: no silent numeric coercion anywhere in the workspace (CLAUDE.md §2.10)
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
unwrap_used = "warn"
